name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-root:
    name: Root Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libhidapi-hidraw0 libhidapi-libusb0
      - name: Install swiftly
        run: |
          curl -L https://swift.org/install/swiftly.sh | bash -s -- --quiet
          echo "$HOME/.local/share/swiftly/bin" >> $GITHUB_PATH
      - name: Run root build script
        run: |
          chmod +x build.sh
          ./build.sh

  build-example:
    name: Example Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libhidapi-hidraw0 libhidapi-libusb0
      - name: Install swiftly
        run: |
          curl -L https://swift.org/install/swiftly.sh | bash -s -- --quiet
          echo "$HOME/.local/share/swiftly/bin" >> $GITHUB_PATH
      - name: Run example build script
        working-directory: Example
        run: |
          chmod +x build.sh
          ./build.sh
