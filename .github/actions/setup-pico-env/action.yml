name: Setup Pico Environment
description: >
  Installs system dependencies, configures the pico-sdk bundle and swiftly
  cache paths, restores (or saves) both caches keyed on all relevant version
  strings from env.json, and installs swiftly (adding it to PATH).
inputs:
  pico-cache-lookup-only:
    description: Check for the Pico SDK cache without downloading it
    required: false
    default: "false"
outputs:
  pico-cache-hit:
    description: Whether the Pico SDK bundle cache was restored from an exact key match
    value: ${{ steps.cache-pico-sdk.outputs.cache-hit }}
  swiftly-cache-hit:
    description: Whether the swiftly cache was restored from an exact key match
    value: ${{ steps.cache-swiftly.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libhidapi-hidraw0 libhidapi-libusb0 libcurl4-openssl-dev

    - name: Configure cache paths
      shell: bash
      run: |
        echo "PICO_SDK_BUNDLE_PATH=$HOME/.pico-sdk" >> $GITHUB_ENV
        echo "SWIFTLY_HOME_DIR=$HOME/.local/share/swiftly" >> $GITHUB_ENV
        echo "SWIFTLY_BIN_DIR=$HOME/.local/share/swiftly/bin" >> $GITHUB_ENV
        echo "SWIFTLY_TOOLCHAINS_DIR=$HOME/.local/share/swiftly/toolchains" >> $GITHUB_ENV

    - name: Read versions for cache keys
      id: sdk-versions
      shell: bash
      run: |
        echo "pico-key=${{ runner.os }}-pico-sdk-bundle-$(jq -r '[.vars.SDK_VERSION,.vars.TOOLCHAIN_VERSION,.vars.CMAKE_VERSION,.vars.NINJA_VERSION,.vars.PICOTOOL_VERSION,.vars.OPENOCD_VERSION] | join("-")' env.json)" >> $GITHUB_OUTPUT
        echo "swift-key=${{ runner.os }}-swiftly-v2-$(jq -r '.vars.SWIFT_VERSION' env.json)" >> $GITHUB_OUTPUT

    - name: Cache Pico SDK bundle
      id: cache-pico-sdk
      uses: actions/cache@v5
      with:
        path: ${{ env.PICO_SDK_BUNDLE_PATH }}
        key: ${{ steps.sdk-versions.outputs.pico-key }}
        lookup-only: ${{ inputs.pico-cache-lookup-only }}

    - name: Cache swiftly
      id: cache-swiftly
      uses: actions/cache@v5
      with:
        path: ${{ env.SWIFTLY_HOME_DIR }}
        key: ${{ steps.sdk-versions.outputs.swift-key }}

    - name: Install swiftly
      shell: bash
      run: |
        if [ ! -f "$SWIFTLY_BIN_DIR/swiftly" ]; then
          curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz
          tar zxf swiftly-$(uname -m).tar.gz
          ./swiftly init --quiet-shell-followup --skip-install
        fi
        echo "$SWIFTLY_BIN_DIR" >> $GITHUB_PATH

    - name: Debug swiftly state
      shell: bash
      run: |
        echo "swiftly-cache-hit=${{ steps.cache-swiftly.outputs.cache-hit }}"
        echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR"
        echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR"
        echo "SWIFTLY_TOOLCHAINS_DIR=$SWIFTLY_TOOLCHAINS_DIR"
        ls -la "$SWIFTLY_HOME_DIR" || true
        find "$SWIFTLY_HOME_DIR" -maxdepth 2 -type d | sort || true
        cat "$SWIFTLY_HOME_DIR/config.json" || true
        if command -v swiftly >/dev/null 2>&1; then
          echo "swiftly-path=$(command -v swiftly)"
          swiftly list || true
        else
          echo "swiftly-path=missing"
        fi

    - name: Check requested Swift toolchain
      id: swift-toolchain
      shell: bash
      run: |
        requested_toolchain="$(jq -r '.vars.SWIFT_VERSION' env.json)"
        echo "requested-toolchain=$requested_toolchain"
        if jq -e --arg requested_toolchain "$requested_toolchain" '.installedToolchains | index($requested_toolchain)' "$SWIFTLY_HOME_DIR/config.json" >/dev/null 2>&1; then
          echo "installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "installed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Swift toolchain
      if: steps.cache-swiftly.outputs.cache-hit != 'true' || steps.swift-toolchain.outputs.installed != 'true'
      shell: bash
      run: |
        swiftly install "$(jq -r '.vars.SWIFT_VERSION' env.json)"
