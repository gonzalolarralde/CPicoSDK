name: Setup Pico Environment
description: >
  Installs system dependencies, configures the pico-sdk bundle cache path,
  restores (or saves) the bundle cache keyed on all SDK version strings from
  env.json, and installs swiftly (adding it to PATH).

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libhidapi-hidraw0 libhidapi-libusb0 libcurl4-openssl-dev

    - name: Configure Pico SDK bundle cache path
      shell: bash
      run: echo "PICO_SDK_BUNDLE_PATH=$HOME/.pico-sdk" >> $GITHUB_ENV

    - name: Read SDK versions for cache key
      id: sdk-versions
      shell: bash
      run: |
        echo "key=${{ runner.os }}-pico-sdk-bundle-$(jq -r '[.vars.SDK_VERSION,.vars.TOOLCHAIN_VERSION,.vars.CMAKE_VERSION,.vars.NINJA_VERSION,.vars.PICOTOOL_VERSION,.vars.OPENOCD_VERSION] | join("-")' env.json)" >> $GITHUB_OUTPUT

    - name: Cache Pico SDK bundle
      uses: actions/cache@v4
      with:
        path: ${{ env.PICO_SDK_BUNDLE_PATH }}
        key: ${{ steps.sdk-versions.outputs.key }}

    - name: Install swiftly
      shell: bash
      run: |
        curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz
        tar zxf swiftly-$(uname -m).tar.gz
        ./swiftly init --quiet-shell-followup
        echo "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/bin" >> $GITHUB_PATH
